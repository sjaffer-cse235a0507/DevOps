<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Registration Form</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="container">
        <h2>Registration Form</h2>
        <form id="registrationForm">
            <label>First Name:</label>
            <input type="text" id="firstName" required><br>

            <label>Last Name:</label>
            <input type="text" id="lastName" required><br>

            <label>Father's Name:</label>
            <input type="text" id="fatherName" required><br>

            <label>Mother's Name:</label>
            <input type="text" id="motherName" required><br>

            <label>Gender:</label>
            <input type="radio" name="gender" value="Male" required> Male
            <input type="radio" name="gender" value="Female"> Female <br>

            <label>Date of Birth:</label>
            <input type="date" id="dob" required><br>

            <label>Address:</label>
            <textarea id="address" required></textarea><br>

            <label>Qualification:</label>
            <input type="text" id="qualification" required><br>

            <label>Upload Passport Photo:</label>
            <input type="file" id="photo" accept="image/*" required><br>

            <label>Upload Signature:</label>
            <input type="file" id="signature" accept="image/*" required><br>

            <label>Email:</label>
            <input type="email" id="email" required><br>

            <label>Password:</label>
            <input type="password" id="password" required><br>

            <label>Mobile Number:</label>
            <input type="tel" id="mobile" pattern="[0-9]{10}" required><br>

            <button type="submit">Submit</button>
            <button type="reset">Reset</button>
        </form>
    </div>
</body>
</html>
